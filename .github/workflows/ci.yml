name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: nexdwatch_test
      POSTGRES_USER: nexdwatch_test
      POSTGRES_PASSWORD: nexdwatch_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      SECRET_KEY: ci-test-only

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate dependencies
        run: python -m pip check

      - name: Run Ruff
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q app experiments manage.py

      - name: Run tests
        run: python -m pytest
