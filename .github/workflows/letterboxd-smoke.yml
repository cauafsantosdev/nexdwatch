name: Letterboxd scraper smoke

on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: letterboxd-scraper-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LETTERBOXD_SMOKE_USERNAME: ${{ vars.LETTERBOXD_SMOKE_USERNAME }}
      LETTERBOXD_SMOKE_FILM_SLUG: ${{ vars.LETTERBOXD_SMOKE_FILM_SLUG }}
      POSTGRES_USER: smoke
      POSTGRES_PASSWORD: smoke
      POSTGRES_DB: smoke
      SECRET_KEY: smoke-only-unused-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned Letterboxd dependency
        run: |
          LETTERBOXDPY_REQUIREMENT="$(grep -E '^letterboxdpy==' requirements.txt)"
      
          if [[ -z "$LETTERBOXDPY_REQUIREMENT" ]]; then
            echo "letterboxdpy pin not found in requirements.txt"
            exit 1
          fi
      
          echo "Installing $LETTERBOXDPY_REQUIREMENT"
          python -m pip install "$LETTERBOXDPY_REQUIREMENT" pydantic pydantic-settings

      - name: Run bounded live scraper smoke
        run: timeout 5m python -m scripts.smoke_letterboxd
